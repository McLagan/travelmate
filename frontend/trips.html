<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdnjs.cloudflare.com https://fonts.googleapis.com; connect-src 'self'; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com https://fonts.googleapis.com; object-src 'none';">
    <meta name="robots" content="noindex, nofollow">
    <title>TravelMate - My Trips</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Application Styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/map" class="nav-brand">
                <i class="fas fa-route"></i>
                TravelMate
            </a>

            <ul class="nav-menu">
                <li><a href="/map" class="nav-link">Map</a></li>
                <li><a href="/trips" class="nav-link active">My Trips</a></li>
                <li><a href="/profile" class="nav-link">Profile</a></li>
            </ul>

            <div class="nav-actions">
                <div class="user-menu" id="userMenu" style="align-items: center; gap: 1rem;">
                    <span id="userName" style="font-weight: 500;"></span>
                    <button class="btn btn-secondary btn-sm" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i>
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content profile-main">
        <div class="profile-container">
            <div class="profile-section trips-page">
                <div class="section-header">
                    <h2><i class="fas fa-suitcase"></i> My Trips</h2>
                    <a class="btn btn-primary btn-sm" href="/map#new"><i class="fas fa-plus"></i> New trip</a>
                </div>
                <div id="tripsList" class="trips-grid"><div class="empty-state"><p>Loading…</p></div></div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="trips.js"></script>
</body>
</html>
