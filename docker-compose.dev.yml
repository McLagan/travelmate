version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: travelmate_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8088:8088"
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
    env_file:
      - ./backend/.env
    environment:
      # Override database URL for Docker network
      - DATABASE_URL=postgresql://postgres:postgres123@db:5432/travelmate_dev
      # Docker Desktop on Windows doesn't pass file-change events into the container;
      # polling makes uvicorn --reload pick up edits without a manual restart
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      - db
      - mailpit
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mail catcher for development: every email the backend sends lands here instead of a real inbox.
  # Web UI: http://localhost:8025 (only from this computer)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data: